version: 2
updates:
  # Go modules: the crypto dependency (circl, ML-DSA-65/ML-KEM) is the one
  # that must never sit stale. Grouped into one PR so a bump is one review.
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    groups:
      go-deps:
        patterns:
          - "*"
  # npm workspaces share the root package-lock.json (sqc-sdk, connect-react,
  # packages/*, apps/*), so one entry covers all of them. Minor and patch
  # bumps arrive as one grouped PR; majors stay separate so each gets a look.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      npm-minor-and-patch:
        update-types:
          - minor
          - patch
  # Separate npm projects with their own lockfiles.
  - package-ecosystem: npm
    directory: /sdk/sqc-sdk/gateway
    schedule:
      interval: weekly
  # The runtime image is what actually ships; keep its base current.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
  # Workflows pin actions to commit SHAs; this keeps those pins current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns:
          - "*"

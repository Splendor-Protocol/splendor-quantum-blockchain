# Secret scanning (gitleaks) — the counterweight to .gitignore. Blocks a live
# secret from entering the tree on PRs and pushes to main, and re-scans weekly
# (and on demand) so a newly added rule can catch anything already merged.
# .gitleaks.toml is the upstream v8.25.0 default with the weak
# `generic-api-key` heuristic disabled (it flags public token addresses and
# domain-separation strings); every other rule is unchanged.
name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The image is published as ghcr.io/gitleaks/gitleaks (and as
      # zricethezav/gitleaks on Docker Hub). There is no gitleaks/gitleaks on
      # Docker Hub, so the pull was refused and nothing was ever scanned.
      # Pinned to the v8.25.0 index digest: this container gets the whole
      # history, so a moved tag must not be able to change what runs over it.
      - name: Detect secrets
        run: |
          docker run --rm -v "$PWD:/scan" -w /scan ghcr.io/gitleaks/gitleaks:v8.25.0@sha256:a157fcc2219f2440861b7541aa125f708fedcb0f1777f390806ffab45538d422 \
            detect --source /scan --config /scan/.gitleaks.toml \
            --no-banner --redact --exit-code 1

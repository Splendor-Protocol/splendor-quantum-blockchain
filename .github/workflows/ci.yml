name: CI

# There was no CI in this repository at all. The committed signer WASM drifted
# from its source twice — once across the CRYSTALS-Dilithium to ML-DSA-65
# migration, and again when a chain-id export was added — and neither was caught,
# because the only existing check (scripts/check-wasm-dist.mjs) compares the
# binary to its recorded digest rather than to the source it was built from. Both
# agree during a drift, so it passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # Scoped to files this change touches, not the whole tree. 36 files predate
      # this workflow and are unformatted (struct alignment only); reformatting
      # them wholesale would collide with work in flight in vm/ and x402/ for no
      # correctness gain. This enforces the rule going forward and lets the
      # backlog be cleared when nothing is mid-air.
      - name: gofmt (changed files)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            base="HEAD~1"
            git cat-file -e "$base^{commit}" 2>/dev/null || { echo "shallow history, skipping"; exit 0; }
          fi
          changed="$(git diff --name-only --diff-filter=ACM "$base" HEAD -- '*.go' | grep -v '^vendor/' || true)"
          if [ -z "$changed" ]; then echo "no Go files changed"; exit 0; fi
          echo "checking:"; echo "$changed"
          unformatted="$(gofmt -l $changed || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files you changed:"; echo "$unformatted"; exit 1
          fi
      - name: go test
        run: go test -count=1 ./...

  wasm-drift:
    name: signer WASM matches its source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The digest is Go-release-sensitive, so this has to build under the same
      # toolchain build.sh pins or it would report drift that does not exist.
      - name: Rebuild the signer from source
        run: |
          cp sdk/bridge/wasm/dist/sqc_signer.wasm /tmp/committed.wasm
          bash sdk/bridge/wasm/build.sh

      - name: Compare the rebuild against every committed copy and pin
        run: |
          set -euo pipefail
          built="$(sha256sum sdk/bridge/wasm/dist/sqc_signer.wasm | cut -d' ' -f1)"
          committed="$(sha256sum /tmp/committed.wasm | cut -d' ' -f1)"
          echo "rebuilt from source : $built"
          echo "committed in repo   : $committed"

          fail=0
          if [ "$built" != "$committed" ]; then
            echo "::error::sdk/bridge/wasm/dist/sqc_signer.wasm does not match its source."
            echo "The signer was changed without rebuilding. Anyone building from this tree"
            echo "gets a binary that does not do what main.go says it does."
            echo "Fix: bash sdk/bridge/wasm/build.sh && (cd sdk/bridge && npm run sync:config)"
            echo "Then re-pin the same digest in splendor-quantum-wallet-extension, which"
            echo "ships its own copy of this artifact."
            fail=1
          fi

          # The extension's copy of this binary moved to
          # splendor-quantum-wallet-extension in c61ab08. It still pins this digest,
          # so it can still drift from this artifact — but it must be checked THERE,
          # by that repo's own CI, against the digest published here. Asserting a
          # path this repo no longer owns just fails every build.

          exit "$fail"

      # The pins themselves, per network and per field. The grep this replaced
      # only asked whether the wasm digest appeared ANYWHERE in the file, so one
      # correct network masked two wrong ones and execSha256 was never checked at
      # all — a wrong wasm_exec.js pin makes every consumer refuse to sign, and
      # would have shipped. check-wasm-dist.mjs is the same check npm publish
      # already runs; CI just never ran it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every network pin names the rebuilt bytes
        run: node sdk/bridge/scripts/check-wasm-dist.mjs

      - name: Golden vector still derives the published address
        run: go test -count=1 ./sdk/bridge/signer/ -run 'Golden|Domain'

name: CI

# There was no CI in this repository at all. The committed signer WASM drifted
# from its source twice — once across the CRYSTALS-Dilithium to ML-DSA-65
# migration, and again when a chain-id export was added — and neither was caught,
# because the only existing check (scripts/check-wasm-dist.mjs) compares the
# binary to its recorded digest rather than to the source it was built from. Both
# agree during a drift, so it passes.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    name: build and test
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      # Scoped to files this change touches, not the whole tree. 36 files predate
      # this workflow and are unformatted (struct alignment only); reformatting
      # them wholesale would collide with work in flight in vm/ and x402/ for no
      # correctness gain. This enforces the rule going forward and lets the
      # backlog be cleared when nothing is mid-air.
      - name: gofmt (changed files)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "no usable base ref; checking HEAD only"
            base="HEAD~1"
            git cat-file -e "$base^{commit}" 2>/dev/null || { echo "shallow history, skipping"; exit 0; }
          fi
          changed="$(git diff --name-only --diff-filter=ACM "$base" HEAD -- '*.go' | grep -v '^vendor/' || true)"
          if [ -z "$changed" ]; then echo "no Go files changed"; exit 0; fi
          echo "checking:"; echo "$changed"
          unformatted="$(gofmt -l $changed || true)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would rewrite these files you changed:"; echo "$unformatted"; exit 1
          fi
      - name: go test
        run: go test -count=1 ./...

  wasm-drift:
    name: signer WASM matches its source
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Nothing enforced that "one signer" claim until now, and a second copy
      # had already appeared: examples/basic-dapp/public/sqc_signer.wasm sat
      # three rebuilds stale, checked by nothing, and the example loads it with
      # allowUnpinnedWasm. sqcWasmPlugin copies that file from wasm/dist on every
      # build, so it never needed committing in the first place.
      - name: No second signer is tracked
        run: |
          set -euo pipefail
          extra="$(git ls-files '*.wasm' | grep -v '^sdk/sqc-sdk/wasm/dist/sqc_signer.wasm$' || true)"
          if [ -z "$extra" ]; then echo "one tracked signer, as intended"; exit 0; fi
          echo "::error::a second signer binary is committed and nothing checks it:"
          echo "$extra"
          echo "Delete it. If a build needs the bytes somewhere, copy them there at"
          echo "build time from sdk/sqc-sdk/wasm/dist — do not commit a second copy."
          exit 1

      # The digest is Go-release-sensitive, so this has to build under the same
      # toolchain build.sh pins or it would report drift that does not exist.
      - name: Rebuild the signer from source
        run: |
          cp sdk/sqc-sdk/wasm/dist/sqc_signer.wasm /tmp/committed.wasm
          bash sdk/sqc-sdk/wasm/build.sh

      - name: Compare the rebuild against every committed copy and pin
        run: |
          set -euo pipefail
          built="$(sha256sum sdk/sqc-sdk/wasm/dist/sqc_signer.wasm | cut -d' ' -f1)"
          committed="$(sha256sum /tmp/committed.wasm | cut -d' ' -f1)"
          echo "rebuilt from source : $built"
          echo "committed in repo   : $committed"

          fail=0
          if [ "$built" != "$committed" ]; then
            echo "::error::sdk/sqc-sdk/wasm/dist/sqc_signer.wasm does not match its source."
            echo "The signer was changed without rebuilding. Anyone building from this tree"
            echo "gets a binary that does not do what main.go says it does."
            echo "Fix: bash sdk/sqc-sdk/wasm/build.sh && (cd sdk/sqc-sdk && npm run sync:config)"
            echo "Then re-pin the same digest in splendor-quantum-wallet-extension, which"
            echo "ships its own copy of this artifact."
            fail=1
          fi

          # This is the only committed copy of the signer, and the step above
          # now enforces that rather than asserting it: sdk/bridge is a pure
          # re-export shim and ships no artifact. The browser extension keeps its
          # own copy (splendor-quantum-wallet-extension) and its own CI compares it
          # against this file, so drift there is caught there.

          exit "$fail"

      # The pins themselves, per network and per field. The grep this replaced
      # only asked whether the wasm digest appeared ANYWHERE in the file, so one
      # correct network masked two wrong ones and execSha256 was never checked at
      # all — a wrong wasm_exec.js pin makes every consumer refuse to sign, and
      # would have shipped. check-wasm-dist.mjs is the same check npm publish
      # already runs; CI just never ran it.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Every network pin names the rebuilt bytes
        run: node sdk/sqc-sdk/scripts/check-wasm-dist.mjs

      - name: Golden vector still derives the published address
        run: go test -count=1 ./sdk/sqc-sdk/signer/ -run 'Golden|Domain'

  js:
    name: SDK typechecks and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # There was no TypeScript or JS job here, only Go and the WASM digest, and
    # three separate breakages rode into main through one merge because of it:
    # literal conflict markers left in connect-react/src/vite.ts, an import in
    # sqc-sdk/src/core/signer.ts one directory too deep, and a signer export the
    # binary did not have. The first two are pure compile errors — two days on
    # main, in packages every dApp builds against, and nothing looked.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # connect-react resolves @splendor/sqc-sdk through a file: link to the
      # sibling package and typechecks against its BUILT dist/, so the SDK has to
      # compile first. Locally that dist is whatever someone last built, which is
      # how a stale one made connect-react look broken when the fault was in
      # sqc-sdk itself. On a runner it is always freshly built.
      - name: Build the SDK
        working-directory: sdk/sqc-sdk
        run: |
          npm ci
          npm run build:ts

      - name: Test the SDK
        working-directory: sdk/sqc-sdk
        run: npm test

      - name: Typecheck and test connect-react
        working-directory: sdk/connect-react
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
          npm test

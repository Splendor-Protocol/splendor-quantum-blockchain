name: CI

# There was no CI in this repository at all. The signer WASM drifted from its
# source three times — the CRYSTALS-Dilithium to ML-DSA-65 migration, a chain-id
# export, and 22 lines of snapshot structs added to core/types — because the
# binary was committed and the only check (scripts/check-wasm-dist.mjs) compares
# it to its recorded digest rather than to the source it was built from. Both
# agree during a drift, so it passes.
#
# The binary is no longer tracked, so there is nothing left to drift: CI builds
# it, and npm `prepack` builds it into the published tarball. What is still
# committed is the sha256 pins consumers verify at load. wasm-drift below
# verifies them; make signer-pins regenerates them for inclusion in the PR.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 10
    env:
      LINT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || 'HEAD^' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Check formatting guardrails
        run: make test-lint
      - name: Formatting and static analysis
        run: make lint

  go:
    name: build and test
    needs: lint
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: go build
        run: go build ./...
      - name: go vet
        run: go vet ./...
      - name: gofmt
        run: make fmt-check
      # -p 4 is pinned, not inherited. `go test` defaults -p to NumCPU, so on
      # ubuntu-24.04 this suite has always run at -p 4 by accident of the
      # runner having 4 vCPUs. Several consensus tests race real wall-clock
      # deadlines as short as 30ms (consensus/timer_hygiene_test.go), and they
      # flake when more package binaries run at once. A self-hosted box with 8
      # or 16 cores would silently become -p 8/-p 16 and start failing tests
      # that have nothing wrong with them, so the value the suite was tuned
      # against is now written down.
      - name: go test
        run: go test -count=1 -p 4 ./...
      # Scans the reachable dependency graph against the Go vulnerability
      # database. Unlike the GitHub advisory feed this checks what the code
      # actually calls, so a CVE in a required-but-unused module path does not
      # gate a merge. Pinned so a scanner release cannot change what gates a
      # merge on its own; v1.8+ needs the Go 1.26 toolchain go.mod declares.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      # Bounded fuzzing of the peer-supplied SQCO wire decoders (object
      # manifests, symbol proofs, frame probes, adversarial absorb streams)
      # and the sealed-read request bodies. `go test ./...` above replays
      # each target's committed seed corpus as a normal test; this spends a
      # small fixed budget on fresh inputs so a regression surfaces here
      # instead of in a release. `make fuzz` runs the same loops locally.
      #
      # Go 1.26's fuzz coordinator can fail a clean run at the instant
      # -fuzztime runs out: it wakes on the expired deadline, then compares
      # the error against a child context the cancellation has not reached
      # yet, so a bare "context deadline exceeded" escapes as a test failure
      # (golang/go#75804). That is how FuzzObjectManifestRequestJSON and
      # FuzzObjectSymbolRequestJSON went red on main with no failing input.
      # The fix shipped in go1.27; the 1.26 backport is golang/go#82362.
      # Until go.mod's toolchain carries it, exactly that outcome passes with
      # a warning: a single failing target, the bare deadline error, and no
      # input written under testdata/fuzz. Anything else fails the job,
      # including a crasher found just before the deadline, which the same
      # race would otherwise report as only "context deadline exceeded".
      - name: go fuzz (bounded)
        run: |
          set -euo pipefail
          fuzz() {
            local pkg="$1" target="$2" log="${RUNNER_TEMP:-/tmp}/fuzz-$2.log" status=0 written
            echo "::group::fuzz ${target}"
            go test "./${pkg}/" -run "^${target}$" -fuzz "${target}" -fuzztime 15s 2>&1 | tee "$log" || status=$?
            echo "::endgroup::"
            [ "$status" -eq 0 ] && return 0
            # A crasher still being minimized at the deadline is written to
            # testdata/fuzz but reported as only "context deadline exceeded",
            # so look for the file first and put it in the log: the next
            # checkout cleans the workspace and it would be lost.
            written="$(git status --porcelain --untracked-files=all -- "${pkg}/testdata/fuzz")" \
              || { echo "::error::${target}: git status failed, cannot rule out a new failing input"; return "$status"; }
            if [ -n "$written" ]; then
              echo "::error::${target}: new failing input under ${pkg}/testdata/fuzz"
              echo "$written" | awk '{ print $2 }' | while read -r f; do echo "--- $f"; cat "$f"; done
              return "$status"
            fi
            # The deadline error must be the only indented line: a failed corpus
            # write is appended to it on a second line, and a crasher or a
            # failing seed adds its own indented lines.
            if [ "$(grep -c -e '--- FAIL:' "$log")" -eq 1 ] \
              && [ "$(grep -c '^    ' "$log")" -eq 1 ] \
              && grep -qxF '    context deadline exceeded' "$log"; then
              echo "::warning::${target}: ignored Go's spurious end-of-budget \"context deadline exceeded\" (golang/go#75804); no failing input was found"
              return 0
            fi
            return "$status"
          }
          for target in FuzzDecodeObjectManifest FuzzDecodeSymbolProof FuzzDecodeManifest FuzzFrameType FuzzObjectReceiverAbsorb; do
            fuzz network/objects "$target"
          done
          for target in FuzzValidateBlockBatchRange FuzzBlockBatchRequestJSON FuzzObjectSymbolRequestJSON FuzzObjectManifestRequestJSON; do
            fuzz network "$target"
          done

  wasm-drift:
    name: signer WASM matches its source
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A committed signer is the thing that drifts, and copies of it appear on
      # their own: examples/basic-dapp/public/sqc_signer.wasm once sat three
      # rebuilds stale, checked by nothing, loaded with allowUnpinnedWasm. Every
      # place that needs the bytes copies them at build time (sqcWasmPlugin) or
      # gets them from the npm package, so none of them needs a copy in git.
      - name: No signer is tracked
        run: |
          set -euo pipefail
          extra="$(git ls-files '*.wasm')"
          if [ -z "$extra" ]; then echo "no signer binary in git, as intended"; exit 0; fi
          echo "::error::a signer binary is committed, and a committed binary drifts:"
          echo "$extra"
          echo "Delete it. Whatever needs the bytes builds them with"
          echo "sdk/sqc-sdk/wasm/build.sh, or takes them from the npm package."
          exit 1

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # The digest is Go-release-sensitive, so this has to build under the same
      # toolchain build.sh pins, or it would re-pin to bytes nobody else gets.
      #
      # Pin updates go through the same checks as source changes. A bot push
      # after merging would otherwise bypass (or fail) main's required checks.
      - name: Rebuild signer and verify committed pins
        run: |
          set -euo pipefail
          bash sdk/sqc-sdk/wasm/build.sh
          node sdk/sqc-sdk/scripts/sync-config.mjs
          pins=(sdk/sqc-sdk/config/sqc.networks.json sdk/sqc-sdk/src/config/sqc.networks.json)
          if git diff --quiet -- "${pins[@]}"; then
            echo "the pins already name the bytes this source builds"
            exit 0
          fi
          git diff --stat -- "${pins[@]}"
          echo "::error::Signer pins changed. Run make signer-pins and commit both sqc.networks.json files in this PR."
          exit 1

      # The pins themselves, per network and per field. The grep this replaced
      # only asked whether the wasm digest appeared ANYWHERE in the file, so one
      # correct network masked two wrong ones and execSha256 was never checked at
      # all — a wrong wasm_exec.js pin makes every consumer refuse to sign, and
      # would have shipped. check-wasm-dist.mjs is the same check npm publish
      # already runs; CI just never ran it.
      - name: Every network pin names the rebuilt bytes
        run: node sdk/sqc-sdk/scripts/check-wasm-dist.mjs

      - name: Golden vector still derives the published address
        run: go test -count=1 ./sdk/sqc-sdk/signer/ -run 'Golden|Domain'

  # The browser extension ships its own copy of the signer and refuses to start
  # unless it matches the digest it pins, so a main push that moves the signer
  # has to reach it. Nothing here told it: its sync ran on ITS pushes and a cron,
  # so a chain change sat unshipped until that clock came round.
  #
  # It fires on every main push, not behind a path filter: the wallet rebuilds
  # the signer from SOURCE, so a go.mod bump moves its bytes as much as a commit
  # under sdk/ does. The receiver no-ops when already in step, so a spurious
  # dispatch costs a two-minute run there. It runs after wasm-drift so the wallet
  # only ever syncs a main whose pins already name the bytes it will rebuild.
  #
  # workflow_dispatch, not repository_dispatch: the permission it needs there is
  # `actions: write`, which can start that workflow and nothing else — it cannot
  # push to the wallet, open PRs, or read its secrets. repository_dispatch would
  # need `contents: write` on the repo holding the signer users' keys go through.
  #
  # Missing token = a warning, not a red main: the wallet's own cron still
  # catches the change, and a chain build has no business failing over a
  # notification it could not send. A token that IS present and cannot dispatch
  # does fail — that is a broken promise rather than an absent one.
  wallet-sync:
    name: tell the wallet extension to re-sync its signer
    needs: wasm-drift
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Dispatch splendor-quantum-wallet-extension/sync-signer.yml
        env:
          GH_TOKEN: ${{ secrets.WALLET_DISPATCH_TOKEN }}
          WALLET_REPO: Splendor-Protocol/splendor-quantum-wallet-extension
          CHAIN_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::the GitHub CLI is not installed on this runner, so the wallet extension was not told the signer may have moved. It will catch up on its own schedule. GitHub-hosted images bundle gh; a self-hosted runner has to install it (see scripts/ci-runner/README.md)."
            exit 0
          fi
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::WALLET_DISPATCH_TOKEN is not set, so the wallet extension was not told the signer may have moved. It will catch up on its own schedule. To make it immediate, add a fine-grained PAT (resource owner Splendor-Protocol; only ${WALLET_REPO}; permissions Actions=Read and write, Metadata=Read) as this repo's WALLET_DISPATCH_TOKEN secret."
            exit 0
          fi
          # No -f inputs: the receiving workflow only declares them on some
          # revisions, and `gh workflow run` errors on an input a workflow does
          # not declare. It rebuilds the signer from this main either way, so
          # the inputs were never more than log decoration.
          gh workflow run sync-signer.yml --repo "$WALLET_REPO" --ref main
          echo "dispatched for chain ${CHAIN_SHA}: https://github.com/${WALLET_REPO}/actions/workflows/sync-signer.yml"

  # CodeQL uploads SARIF to the code-scanning API, and that API refuses a
  # private repository unless GitHub Advanced Security is enabled on it. This
  # org is on the free plan with GHAS off, so the API answers
  #
  #   403 Advanced Security must be enabled for this repository to use code scanning
  #
  # which means this job cannot go green here on ANY runner — hosted or
  # self-hosted. It is gated off rather than deleted so that enabling GHAS (or
  # making the repo public) is a one-variable change: set ENABLE_CODEQL=true.
  # Left ungated it is a permanently red check that teaches people to ignore
  # red checks.
  #
  # Worth knowing before turning it on for a self-hosted runner: the CodeQL
  # bundle is preinstalled in the hosted image's tool cache and is about a
  # gigabyte. A self-hosted runner downloads it on every cold run.
  codeql:
    name: CodeQL static analysis (Go)
    if: vars.ENABLE_CODEQL == 'true'
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: go
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - uses: github/codeql-action/analyze@v3

  js:
    name: SDK typechecks and tests
    runs-on: ${{ vars.CI_RUNNER_LABEL || 'ubuntu-24.04' }}
    timeout-minutes: 20
    # There was no TypeScript or JS job here, only Go and the WASM digest, and
    # three separate breakages rode into main through one merge because of it:
    # literal conflict markers left in connect-react/src/vite.ts, an import in
    # sqc-sdk/src/core/signer.ts one directory too deep, and a signer export the
    # binary did not have. The first two are pure compile errors — two days on
    # main, in packages every dApp builds against, and nothing looked.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # The signer is a build output now, and these tests load the real one
      # (permit-golden and the audit scenarios call loadWasmSigner). Same script
      # a developer runs once after cloning.
      - name: Build the signer these tests load
        run: bash sdk/sqc-sdk/wasm/build.sh

      # connect-react resolves @splendor/sqc-sdk through a file: link to the
      # sibling package and typechecks against its BUILT dist/, so the SDK has to
      # compile first. Locally that dist is whatever someone last built, which is
      # how a stale one made connect-react look broken when the fault was in
      # sqc-sdk itself. On a runner it is always freshly built.
      - name: Build the SDK
        working-directory: sdk/sqc-sdk
        run: |
          npm ci
          npm run build:ts

      - name: Test the SDK
        working-directory: sdk/sqc-sdk
        run: npm test

      - name: Typecheck and test connect-react
        working-directory: sdk/connect-react
        run: |
          npm ci
          npx tsc --noEmit -p tsconfig.json
          npm test

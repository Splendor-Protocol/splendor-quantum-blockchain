# One-touch gateway deploy. Network defaults: src/config/sqc.networks.json
# Override: SQC_NETWORK=local|testnet|mainnet  SQC_RPC=...  MODE=proxy|service-wallet
services:
  pq-bridge-gateway:
    build:
      context: ..
      dockerfile: gateway/Dockerfile
    ports:
      - "${GATEWAY_PORT:-3090}:3090"
    environment:
      SQC_NETWORK: ${SQC_NETWORK:-local}
      SQC_RPC: ${SQC_RPC:-http://host.docker.internal:8080}
      MODE: ${MODE:-proxy}
      PORT: "3090"
      # Public proxy rejects seed/sig by default. Private backends only:
      # ALLOW_CUSTODIAL_PROXY: "1"
      # PUBLIC_HEALTH: "0"
      # CORS_ORIGINS: "https://app.example"
      # GATEWAY_API_KEY: "..."
      # SERVICE_SEED / SERVICE_EVM_KEY only for MODE=service-wallet
    extra_hosts:
      - "host.docker.internal:host-gateway"

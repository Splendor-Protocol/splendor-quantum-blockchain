<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Splendor PQ Bridge — Seed Demo</title>
  <style>
    :root {
      --bg: #0c1210;
      --fg: #e8f0ea;
      --accent: #3dba7a;
      --muted: #8aa094;
      --panel: #152019;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(ellipse at top, #1a2e24 0%, var(--bg) 55%);
      color: var(--fg);
      padding: 2rem;
    }
    h1 { font-weight: 600; letter-spacing: -0.02em; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); margin-bottom: 1.5rem; }
    .row { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    button {
      background: var(--accent);
      color: #062012;
      border: none;
      padding: 0.65rem 1.1rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
    }
    button.secondary { background: #2a3d32; color: var(--fg); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    input {
      background: var(--panel);
      border: 1px solid #2a3d32;
      color: var(--fg);
      padding: 0.65rem 0.8rem;
      border-radius: 6px;
      min-width: 280px;
    }
    pre {
      background: var(--panel);
      border: 1px solid #2a3d32;
      border-radius: 8px;
      padding: 1rem;
      overflow: auto;
      font-size: 0.85rem;
      line-height: 1.45;
    }
    .label { font-size: 0.8rem; color: var(--muted); margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <h1>Splendor PQ Bridge</h1>
  <p class="sub">Native ML-DSA-65 seed wallet (WASM signer). Serve this folder with the WASM files.</p>

  <div class="row">
    <button id="btnConnect">Connect with seed</button>
    <button id="btnBalance" class="secondary" disabled>Refresh balance</button>
    <button id="btnLock" class="secondary" disabled>Lock</button>
  </div>

  <div class="label">Recipient SQ: address</div>
  <div class="row">
    <input id="to" placeholder="SQ:..." />
    <input id="amount" placeholder="Amount SPLD e.g. 0.01" style="min-width:140px" />
    <button id="btnSend" disabled>Send</button>
  </div>

  <pre id="log">Ready. Serve wasm/dist as /sqc_signer.wasm and /wasm_exec.js\n(or set window.__SQC_WASM_BASE).</pre>

  <script type="module">
    // Expect a bundled or CDN build. For local demo without bundler, use gateway + node.
    // This demo assumes you import a browser build; fallback uses dynamic import from /dist/index.js
    // after copying wasm to web root.

    const logEl = document.getElementById('log');
    const log = (msg) => {
      logEl.textContent += '\n' + (typeof msg === 'string' ? msg : JSON.stringify(msg, null, 2));
    };

    let bridge = null;

    async function loadBridge() {
      const base = window.__SQC_WASM_BASE || '';
      const mod = await import('../dist/browser.js');
      bridge = new mod.SplendorPQBridge({
        rpcUrl: window.__SQC_RPC || 'http://localhost:8080',
        wasmUrl: base + '/sqc_signer.wasm',
        execUrl: base + '/wasm_exec.js',
      });
      return mod;
    }

    document.getElementById('btnConnect').onclick = async () => {
      try {
        await loadBridge();
        const seed = window.prompt('32-byte seed hex (64 chars)') || '';
        const info = await bridge.connect({ mode: 'seed', seed });
        log('Connected');
        log(info);
        document.getElementById('btnBalance').disabled = false;
        document.getElementById('btnSend').disabled = false;
        document.getElementById('btnLock').disabled = false;
        const bal = await bridge.getBalance();
        log(bal);
      } catch (e) {
        log('Error: ' + e.message);
      }
    };

    document.getElementById('btnBalance').onclick = async () => {
      try {
        log(await bridge.getBalance());
      } catch (e) {
        log('Error: ' + e.message);
      }
    };

    document.getElementById('btnSend').onclick = async () => {
      try {
        const to = document.getElementById('to').value.trim();
        const amountSPLD = document.getElementById('amount').value.trim();
        const res = await bridge.sendTransfer({ to, amount: '0', amountSPLD });
        log(res);
      } catch (e) {
        log('Error: ' + e.message);
      }
    };

    document.getElementById('btnLock').onclick = () => {
      bridge.lock();
      log('Locked');
      document.getElementById('btnBalance').disabled = true;
      document.getElementById('btnSend').disabled = true;
      document.getElementById('btnLock').disabled = true;
    };
  </script>
</body>
</html>

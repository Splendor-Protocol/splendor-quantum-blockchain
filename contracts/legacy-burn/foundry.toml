[profile.default]
src = "src"
out = "out"
test = "test"
script = "script"
libs = ["lib"]
solc = "0.8.28"
# The legacy Splendor mainnet (chain 2691) runs a pre-Merge geth fork.
# Never compile with a Cancun/Shanghai default (PUSH0/MCOPY would break it).
evm_version = "london"
optimizer = true
optimizer_runs = 200
# forge-std 1.15.0 is vendored under lib/ (copied, not a submodule) so the
# project builds fully offline. No other dependencies, on purpose.
remappings = ["forge-std/=lib/forge-std/src/"]
